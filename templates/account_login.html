{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}

<h1>Welcome back</h1>

{% if error %}<article><strong>{{ error }}</strong></article>{% endif %}

<form method="post" class="snow-card">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit">Log in</button>
    <p>New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</form>

{% endblock %}
