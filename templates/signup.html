{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}

<h1>Create your account</h1>

{% if errors %}
<article>
    <p><strong>Please fix the following:</strong></p>
    <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
</article>
{% endif %}

<form method="post" class="snow-card">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email }}" autocomplete="email" required>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" autocomplete="name" required>

    <label for="phone">Phone (optional)</label>
    <input type="tel" id="phone" name="phone" value="{{ form.phone }}" autocomplete="tel">

    <label for="password">Password (at least 8 characters)</label>
    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>

    <button type="submit">Create account</button>
</form>

{% endblock %}
