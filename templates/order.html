<h1> Your Christmas Tree is 1 Order Away!!!</h1>

<form method="post">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email">

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" required>



    <h2>Delivery Address</h2>

    <label for="street">Street address</label>
    <input type="text" id="street" name="street" autocomplete="address-line1" required>

    <label for="apt">Apt / unit (optional)</label>
    <input type="text" id="apt" name="apt" autocomplete="address-line2">

    <label for="city">City</label>
    <input type="text" id="city" name="city" value="Arlington" autocomplete="address-level2" required>

    <label for="zip">ZIP code</label>
    <input type="text" id="zip" name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="postal-code" required>

    <p>We deliver in Virginia only.</p>

    <label for="delivery_date">Delivery Date</label>
    <input type="date" id="delivery_date" name="delivery_date" required>

    <label for="time_window">Time Window of Delivery</label>
    <select id="time_window" name="time_window" required>
        <option value="">Choose a time</option>
        <option value="morning">Morning (9am–12pm)</option>
        <option value="afternoon">Afternoon (12–4pm)</option>
        <option value="evening">Evening (4–7pm)</option>
    </select>

    <label for="delivery_notes">Delivery Notes (Optional)</label>
    <textarea id="delivery_notes" name="delivery_notes" rows="3" placeholder="Gate Code, Parking, Where to leave the Tree"></textarea>
    <button type="submit">Send</button>

</form>
