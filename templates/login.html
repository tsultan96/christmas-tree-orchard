{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<h1>Admin login</h1>
{% if error %}<p><strong>{{ error }}</strong></p>{% endif %}
<form method="post">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autofocus>
    <button type="submit">Log in</button>
</form>
{% endblock %}
